# E25 - تحقّق CI صغير (اختياري). لا نشر، ولا أسرار، ولا بيانات اعتماد إنتاج. الغرض: كشف الكسر مبكرًا في كل PR/دفع.
# ما يفعله: تثبيت التبعيات من ملفات القفل، بناء الواجهة، فحص صياغة PHP، ثم مجموعات اختبار حرجة محددة (ليست المجموعة الكاملة كي يبقى الزمن معقولًا).
# ما لا يفعله عمدًا: لا deploy، لا migrate على بيئة حقيقية، لا composer/npm update، لا أسرار GitHub. تدقيق التبعيات (composer/npm audit) للإبلاغ فقط ولا يفشل البناء.
# توصية لاحقة (P2): تثبيت إجراءات GitHub على SHA كامل بدل الوسوم.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, sqlite3, gd, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies (من composer.lock)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment (بلا أسرار حقيقية)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/testing.sqlite

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & build frontend (من package-lock.json)
        run: |
          npm ci
          npm run build

      - name: PHP syntax check
        run: |
          errors=$(find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l 2>&1 | grep -v '^No syntax errors detected' || true)
          if [ -n "$errors" ]; then echo "$errors"; exit 1; fi

      - name: Shell scripts syntax check
        run: |
          for f in tools/deploy/*.sh tools/backup/*.sh; do bash -n "$f"; done

      - name: Targeted regression suites (E25 + production + operations + E24 performance + E34 liveops)
        run: |
          php artisan test --compact \
            tests/Feature/OperationsE25 \
            tests/Feature/Production \
            tests/Feature/Operations \
            tests/Feature/PerformanceE24 \
            tests/Feature/LiveOpsE34

      - name: Composer audit (تقرير فقط)
        continue-on-error: true
        run: composer audit --no-interaction

      - name: npm audit (تقرير فقط)
        continue-on-error: true
        run: npm audit --audit-level=high

  # E31: تكافؤ MySQL. خدمة MySQL 8 مؤقتة بجانب المهمة (بيانات اعتماد اختبار فقط تعيش دقائق داخل الحاوية، ليست أسرارًا ولا تُستعمل خارجها).
  # يشغّل اختبارات E31 على MySQL الحقيقية + أهم مجموعات السلامة (محافظ/متجر/منافسة/بحث/مبدعون/رعاية). مهمة validate (SQLite) باقية كما هي.
  # لا نشر ولا migrate على بيئة حقيقية ولا composer/npm update.
  mysql-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ahjiyat_platform_test_mysql
      DB_USERNAME: root
      DB_PASSWORD: ci-only-test-password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-test-password
          MYSQL_DATABASE: ahjiyat_platform_test_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, sqlite3, pdo_mysql, gd, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies (من composer.lock)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment (بلا أسرار حقيقية)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & build frontend (من package-lock.json)
        run: |
          npm ci
          npm run build

      - name: Static MySQL compatibility (no live database needed)
        run: php artisan db:parity --static

      - name: E31 on MySQL (fresh migrate + parity + transfer + concurrency + domain integrity)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/DatabaseE31 tests/Unit/TestDatabaseGuardTest.php

      - name: Critical integrity subsets on MySQL (wallet / store / competitive / search / creators / sponsorship)
        run: |
          php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist \
            tests/Feature/Economy \
            tests/Feature/GemWalletServiceTest.php \
            tests/Feature/PuzzleAttemptServiceTest.php \
            tests/Feature/Store \
            tests/Feature/Competitive \
            tests/Feature/CompetitiveRewards \
            tests/Feature/DiscoveryE27 \
            tests/Feature/CreatorE28 \
            tests/Feature/EngagementE29 \
            tests/Feature/SponsorshipE30 \
            tests/Feature/CreatorSeriesE30

      - name: E32 payments on MySQL (verify / refund / reconciliation / reward integration)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/PaymentsE32

      - name: E33 referrals on MySQL (unique guards / FK policies / idempotent rewards / privacy / performance)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/ReferralE33

      # E34: مجموعة جزئية صغيرة تغطي ما يختلف فعلًا على MySQL: التزامن/المفاتيح الفريدة والإجراءات المرجعية، التدوير الحتمي، وحراس الأداء. البقية على SQLite.
      - name: E34 liveops on MySQL (assignment concurrency / unique guards / FK policies / deterministic rotation / query budgets)
        run: |
          php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist \
            tests/Feature/LiveOpsE34/E34ConcurrencyTest.php \
            tests/Feature/LiveOpsE34/E34PoolRotationTest.php \
            tests/Feature/LiveOpsE34/E34PerformanceTest.php

      # E35: مجموعة جزئية صغيرة لما يختلف فعلًا على MySQL: الترحيل/ملء المواضع القديمة، فرادة الحفظ، قيد البلاغ المفتوح الواحد، المواضع الحتمية، فرادة عناصر الرف، سلامة المفاتيح الأجنبية. البقية على SQLite.
      - name: E35 public collections on MySQL (backfill / unique save / one open report / positions / shelf item uniqueness / FK integrity)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/PublicCollectionsE35/E35MysqlSchemaTest.php

      # E36: مجموعة جزئية صغيرة لما يختلف فعلًا على MySQL: فرادة النقاش الكسول وسباقه، فرادة الإعجاب، قيد البلاغ المفتوح الواحد، المفتاح الأجنبي المركّب (الأب/النقاش)، ذرّية العدّادات، سياسة المفاتيح الأجنبية عند حذف الحسابات، وسلامة النص العربي (1000 حرف). البقية على SQLite.
      - name: E36 community discussions on MySQL (lazy thread uniqueness / unique like / one open report / composite FK / atomic counters / FK policy / Arabic round-trip)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/DiscussionsE36/E36MysqlSchemaTest.php

      # E37: مجموعة جزئية صغيرة (≈20 ث) لما يختلف فعلًا على MySQL: فرادة اللقطة لكل مستخدم وفرادة المبدع المختار، UPSERT الذرّي من قراءة قديمة، دقّة الأعداد الصحيحة (SUM/COUNT) وقيد المدى 0..10000، فهارس الترتيب، سياسة المفاتيح الأجنبية (حذف الحساب/المبدع/المحرِّر)، النص العربي، وحتمية ترتيب القاعدة. البقية على SQLite.
      - name: E37 community reputation on MySQL (snapshot uniqueness / atomic upsert / integer exactness / ranking indexes / FK policy / Arabic round-trip / deterministic order)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/ReputationE37/E37MysqlSchemaTest.php

      # E38: مجموعة جزئية صغيرة (≈20 ث) لما يختلف فعلًا على MySQL: قيود «بلاغ في حالة فعّالة واحدة / إجراء فعّال واحد على الهدف / اعتراض فعّال واحد» (active_marker) مع تعايش NULL، سياسة المفاتيح الأجنبية (التاريخ لا يُحذف تتابعيًا وحذف الحساب يُفرِّغ المراجع فقط)، سلامة النص العربي حتى حدود الأعمدة، فهارس الطابور، حتمية ترتيب الطابور واتحاد صندوق البلاغات (UNION ALL)، والحجز الذرّي. البقية على SQLite.
      - name: E38 trust & safety on MySQL (one active source/action/appeal / FK retention / Arabic round-trip / queue indexes / deterministic union / atomic claim)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/TrustSafetyE38/E38MysqlSchemaTest.php

      # E39: مجموعة جزئية صغيرة (≈15 ث) لما يختلف فعلًا على MySQL: فرادة التخصيص (فترة، مبدع) وحساب المبدع وsource_key ومفتاح الطلب المفتوح (open_account_id) والمرجع الخارجي مع تعايش NULL، سياسة المفاتيح الأجنبية (التاريخ المالي لا يُحذف تتابعيًا وحذف حساب إداري يُفرِّغ المراجع فقط)، النص العربي حتى حدود الأعمدة، دقّة الأعداد الصحيحة الكبيرة (SUM)، حتمية توزيع الكسور بأقل معرّف مبدع، الفترة نصف المفتوحة، الفهارس المسماة، ولا float/decimal. البقية على SQLite.
      - name: E39 creator finance on MySQL (allocation/account/source_key/open-payout/reference uniqueness / FK retention / Arabic round-trip / big-integer exactness / deterministic remainder / half-open period / named indexes)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/CreatorFinanceE39/E39MysqlSchemaTest.php

      # E40: مجموعة جزئية صغيرة (≈10 ث) لما يختلف فعلًا على MySQL: فرادة التقدّم (لاعب، مسار) والشريحة والمكافأة والمطالبة وsource_key ومفتاح الطلب المفتوح ومسار فعّال واحد (live_slot) مع تعايش NULL، سياسة المفاتيح الأجنبية (التاريخ المالي والتقدّمي لا يُحذف تتابعيًا وحذف حساب إداري يُفرِّغ المراجع فقط)، النص العربي والرموز التعبيرية حتى حدود الأعمدة، دقّة الأعداد الصحيحة الكبيرة (SUM/INT UNSIGNED)، حتمية حساب الشريحة بغض النظر عن ترتيب الإدراج، الفهارس المسماة، ولا float/decimal. البقية على SQLite.
      - name: E40 Ahjiyat Pass on MySQL (progress/tier/reward/claim/source_key/open-order/live-slot uniqueness / FK retention / Arabic round-trip / big-integer exactness / deterministic tiers / named indexes)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/AhjiyatPassE40/E40MysqlSchemaTest.php

      # E41: مجموعة جزئية صغيرة (≈20 ث) لما يختلف فعلًا على MySQL: فرادة مراجع المزوّد (جلسة/دفعة/استرداد لكل مزوّد) مع تعايش NULL، فرادة حدث المزوّد، الطلب المفتوح الواحد، النص العربي والرموز التعبيرية حتى حدود الأعمدة الجديدة، دقّة الأعداد الصحيحة الكبيرة، سياسة المفاتيح الأجنبية (سجل المزوّد والتاريخ المالي لا يُحذفان تتابعيًا)، الفهارس المسماة، ولا float/decimal. البقية على SQLite.
      - name: E41 consumer commerce on MySQL (provider reference/event uniqueness / one open order / FK retention / Arabic round-trip / big-integer exactness / named indexes)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/CommerceE41/E41MysqlSchemaTest.php

      # E42: مجموعة جزئية صغيرة (≈30 ث) لما يختلف فعلًا على MySQL: فرادة مفتاح المرحلة داخل الموسم ورابط الكيان لكل نوع مع تعايش NULL، المفاتيح الأجنبية الحقيقية (لا روابط يتيمة)، سياسة الحذف (الموسم يملك مراحله وإعلاناته وروابطه؛ حذف الكيان يزيل الرابط فقط؛ حذف المسار يفكّ الربط)، النص العربي حتى حدود الأعمدة، الفهارس المسماة، ولا float/decimal. البقية على SQLite.
      - name: E42 season orchestration on MySQL (phase key / content link uniqueness with NULL coexistence / real FKs / deletion policy / Arabic round-trip / named indexes)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/SeasonE42/E42MysqlSchemaTest.php

      # E43: مجموعة جزئية صغيرة (≈20 ث) لما يختلف فعلًا على MySQL: فرادة (مستخدم، سلسلة) للوصول، وعرض حيّ واحد لكل سلسلة (live_series_id) مع تعايش NULL بعد السحب، وبيع واحد لكل شراء وقيد دائن/عاكس فريد، وفرادة source_key في دفتر E39 للبيع والعكس،
      # سياسة المفاتيح الأجنبية (التاريخ المالي والوصول لا يُحذفان تتابعيًا)، النص العربي والرموز التعبيرية حتى حدود الأعمدة، دقّة الأعداد الصحيحة الكبيرة في القسمة، وحتمية قاعدة الباقي، الفهارس المسماة، ولا float/decimal. البقية على SQLite.
      - name: E43 creator premium marketplace on MySQL (one live offer per series / one access per user+series / one sale per purchase / ledger source_key / FK retention / Arabic round-trip / big-integer split exactness / named indexes)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/CreatorPremiumE43/E43MysqlSchemaTest.php

      # E44: مجموعة جزئية صغيرة (≈45 ث) لما يختلف فعلًا على MySQL: فرادة (موسم) لصف الإعدادات و(موسم، مبدع) و(مستخدم، موسم) للقائمة، وفرادة ربط السلسلة، وميزانية واحدة لكل ناخب وتوزيع واحد لكل (كاتب، ناخب) مع تعايش NULL بعد محو حساب الناخب،
      # وفرادة قرار الجائزة (كاتب، بند) وسقف المبلغ بالوحدة الصغرى، وفرادة باقة (موسم، مستوى) وبطاقة لكل دفعة، وفرادة source_key وreverses_entry_id في دفتر نقاط الدعم مع الأعمدة الموقَّعة، وصف إحصاء واحد لكل (موسم، مستخدم)،
      # سياسة المفاتيح الأجنبية (التاريخ لا يُحذف تتابعيًا) وحدود النص العربي والرموز التعبيرية، وفرز الترتيب مع NULL أخيرًا، والفهارس المسماة، ولا float/decimal، ثم مساران كاملان (الكتّاب والداعمون) على المحرك الحقيقي. البقية على SQLite.
      - name: E44 seasonal writers league and supporter recognition on MySQL (settings/roster/series uniqueness / one budget per voter / one allocation per writer+voter / award and ledger uniqueness / FK retention / Arabic round-trip / NULL-last ranking / named indexes / full writer and supporter paths)
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml.dist tests/Feature/SeasonalRecognitionE44/E44MysqlSchemaTest.php

      - name: Schema parity against the migrated MySQL database (read-only)
        run: php artisan db:parity --connection=mysql --runtime

      # E32: سباق حقيقي بين عمليتي PHP على MySQL (تحقق مزدوج/استرداد مزدوج/مفتاح مكافأة/تراجع استثناء مُحقَن).
      # يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي آخر خطوة بعد فحص المخطط.
      - name: E32 real-concurrency probe on MySQL (two OS processes)
        timeout-minutes: 10
        env:
          DB_CONNECTION: mysql
        run: php tools/e32/concurrency-probe.php --rounds=4

      # E39: سباق حقيقي بين عمليات PHP على MySQL (طلب دفعة مزدوج / إقفال مزدوج / صرف مزدوج بمرجعين / اعتماد↔رفض / إلغاء↔اعتماد / استثناء مُحقَن / تفعيل↔إقفال) ثم مصالحة مالية نظيفة.
      # يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي بعد مسبار E32 في آخر الخطوات.
      - name: E39 real-concurrency probe on MySQL (parallel OS processes)
        timeout-minutes: 10
        env:
          DB_CONNECTION: mysql
        run: php tools/e39/concurrency-probe.php --rounds=4

      # E40: سباق حقيقي بين عمليات PHP على MySQL (طلب مميز مزدوج / تحقق مزدوج / تحقق↔رفض / مطالبة مزدوجة / استلام الكل المتزامن / استعادة نقاط مزدوجة / استرداد↔مطالبات مميزة / استثناء مُحقَن داخل المطالبة / مزامنة الدورة عند لحظة البدء) ثم مصالحة نظيفة.
      # يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي بعد مسبار E39 في آخر الخطوات.
      - name: E40 real-concurrency probe on MySQL (parallel OS processes)
        timeout-minutes: 10
        env:
          DB_CONNECTION: mysql
        run: php tools/e40/concurrency-probe.php --rounds=4

      # E41: سباق حقيقي بين عمليات PHP على MySQL بالمزوّد التجريبي (بدء checkout مزدوج / الحدث المدفوع نفسه من 4 عمليات / أحداث مدفوع-فاشل-ملغى بترتيب عشوائي / تأكيد-تجاهل-استرداد متزامن لدفعة معلَّمة / استرداد متزامن / مدفوع↔انتهاء / استثناء مُحقَن عند إدراج سجل الحدث) ثم مصالحة تجارة نظيفة.
      # يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي بعد مسبار E40 في آخر الخطوات. كاش الملفات المشترك في مجلد مؤقت خاص بالمسبار.
      - name: E41 real-concurrency probe on MySQL (parallel OS processes)
        timeout-minutes: 10
        env:
          DB_CONNECTION: mysql
        run: php tools/e41/concurrency-probe.php --rounds=4

      # E42: سباق حقيقي بين عمليات PHP على MySQL (بدء الموسم مرة واحدة / مراحل متداخلة ومتجاورة / حدود المراحل والمحتوى والإعلانات / ربط مكرر / معالج seasons:process متوازٍ لمرحلة وإعلانات / استثناء مُحقَن داخل معاملة المرحلة) ثم فحوص سلامة نهائية (لا تداخل، لا رابط مكرر، لا إشعار مكرر، تكافؤ المرئية SQL↔PHP).
      # يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي بعد مسبار E41 في آخر الخطوات. كاش الملفات المشترك في مجلد مؤقت خاص بالمسبار.
      - name: E42 real-concurrency probe on MySQL (parallel OS processes)
        timeout-minutes: 10
        env:
          DB_CONNECTION: mysql
        run: php tools/e42/concurrency-probe.php --rounds=4

      # E43: سباق حقيقي بين عمليات PHP على MySQL بالمزوّد التجريبي (تحقق مزدوج للشراء نفسه من 4 عمليات / شراءان لمشترٍ واحد للسلسلة نفسها / استرداد↔تحقق / استرداد مزدوج / عكس الحصة مع دفعة متزامنة تستهلك المتاح / تفعيل عرض↔إيقاف / استثناء مُحقَن داخل التحقق) ثم فحوص سلامة نهائية
      # (وصول واحد لكل (مستخدم، سلسلة)، بيع واحد وقيد دائن واحد لكل شراء، لا رصيد سالب، مصالحة السوق المميز نظيفة). يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي بعد مسبار E42 في آخر الخطوات.
      - name: E43 real-concurrency probe on MySQL (parallel OS processes)
        timeout-minutes: 10
        env:
          DB_CONNECTION: mysql
        run: php tools/e43/concurrency-probe.php --rounds=4

      # E44: سباق حقيقي بين عمليات PHP على MySQL (ميزانية الـ10 نجوم بين كتّاب متنافسين وتكرار الطلب نفسه / إعادة توزيع الناخب نفسه بقيم مختلفة / ستة ناخبين على كاتب واحد / توزيع متعاكس بين كاتبين / سحب كاتب ↔ تصويت / ثلاثة إنهاءات للدوري / منح المصدر نفسه ×4 / مصادر مختلفة لمستخدم واحد / عكس مكرر / إنهاء ترتيب الداعمين ↔ منح لجدد وقدامى وعكس متأخر)
      # ثم مطابقة الدوري والداعمين وفحوص سلامة نهائية (الدفتر ↔ المجاميع، لا جمود 1213 ولا انتظار قفل 1205، لا صف إحصاء يتيم بلا ختم). يمسح قاعدة الاختبار المؤقتة (migrate:fresh) ويرفض أي قاعدة لا ينتهي اسمها بـ_test؛ لذا يأتي في آخر الخطوات بعد مسابير الأجزاء السابقة. كاش الملفات المشترك في مجلد مؤقت خاص بالمسبار.
      - name: E44 real-concurrency probe on MySQL (parallel OS processes)
        timeout-minutes: 15
        env:
          DB_CONNECTION: mysql
        run: php tools/e44/concurrency-probe.php --rounds=4
